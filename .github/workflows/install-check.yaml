# Does greta install and run, on each TensorFlow version it accepts?
#
# This replaces the hand-maintained `greta_deps_tf_tfp` table. A version is
# supported if its job is green, which cannot go stale the way a dataset can.
# It checks that greta runs, not that it fits well -- correctness is the test
# suite's job, and duplicating it here would only add ways to go red for
# reasons that have nothing to do with installation.
#
# Weekly rather than per-push: each job builds a Python environment from
# scratch, and the conda jobs download over a gigabyte. Saturday, so a failure
# is waiting to be read on Monday.
#
# Both `schedule` and `workflow_dispatch` require this file to be on the default
# branch before GitHub will run it -- dispatch is not a way to try a workflow
# that has never been merged. The pull_request trigger is, and it is filtered to
# the files that can actually break an install, so ordinary pull requests do not
# pay for eleven Python environments.
#
# A red cell is a result, not a flake to be tolerated. Either the version is
# fixable, or `check_greta_tf_supported()` should stop accepting it.

on:
  schedule:
    - cron: '0 5 * * Sat'
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/install_greta_deps.R'
      - 'R/greta_install_python_deps.R'
      - 'R/greta_install_miniconda.R'
      - 'R/install_tensorflow.R'
      - 'R/new_install_process.R'
      - 'R/python_backend.R'
      - 'R/reinstallers.R'
      - '.github/workflows/install-check.yaml'
      - '.github/scripts/install-check.R'

name: install-check

jobs:
  install-check:
    name: ${{ matrix.os }}, tf-${{ matrix.tf }}, ${{ matrix.backend }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # every TF version greta accepts, on one OS, via uv. 'default' is
          # whatever greta_deps_default$tf currently is, so the newest version
          # stays covered without editing this list
          - { os: 'ubuntu-latest', tf: '2.16.0', backend: 'uv' }
          - { os: 'ubuntu-latest', tf: '2.17.0', backend: 'uv' }
          - { os: 'ubuntu-latest', tf: '2.18.0', backend: 'uv' }
          - { os: 'ubuntu-latest', tf: '2.19.0', backend: 'uv' }
          - { os: 'ubuntu-latest', tf: '2.20.0', backend: 'uv' }
          - { os: 'ubuntu-latest', tf: 'default', backend: 'uv' }
          # the default version everywhere, so OS-specific breakage shows up
          - { os: 'macOS-latest', tf: 'default', backend: 'uv' }
          - { os: 'windows-latest', tf: 'default', backend: 'uv' }
          # the conda path, which has no other CI coverage
          - { os: 'ubuntu-latest', tf: 'default', backend: 'conda' }
          - { os: 'macOS-latest', tf: 'default', backend: 'conda' }
          - { os: 'windows-latest', tf: 'default', backend: 'conda' }

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GRETA_TF_VERSION: ${{ matrix.tf }}
      GRETA_BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # CRAN reticulate, not the development version: this checks what users
      # actually install
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      # A separate R session, because greta_set_python() only takes effect on
      # the next load. Doing this in the same session as the exercise runs it
      # against uv instead, and passes wherever uv happens to work.
      - name: Build the conda environment
        if: matrix.backend == 'conda'
        run: Rscript .github/scripts/install-conda.R

      - name: Exercise greta
        run: Rscript .github/scripts/install-check.R

  newer-tensorflow-available:
    name: newer TensorFlow released?
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::. any::jsonlite

      - name: Compare greta's pin against PyPI
        run: Rscript .github/scripts/check-latest-tf.R
