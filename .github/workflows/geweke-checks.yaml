# Do greta's samplers still sample from the distribution they should?
#
# test_posteriors_geweke.R compares hmc(), rwmh() and slice() against draws
# taken the long way round, by Gibbs sampling the posterior and the data
# generating function. It is the only check that catches a sampler drifting
# from its target: TensorFlow Probability 0.25.0 silently changed how
# lkj_correlation() and wishart() draw, and nothing else in the suite noticed.
#
# It runs here rather than in the ordinary suite because it is stochastic. Each
# sampler is checked at p >= 0.005, so across three roughly one run in 70 fails
# by chance. That is tolerable for a check nobody has to merge past, and not
# tolerable inside R CMD check, where it would surface as a random CRAN
# failure. Being slow is no longer a reason: the three samplers take about 40
# seconds at niter = 2000, down from roughly half an hour, because the loop no
# longer rebuilds the log prob tf_function once per iteration -- see #739.
#
# On pull requests that touch the code it tests, and weekly as a backstop for
# anything that reaches main another way. Tuesday, so a failure is waiting at
# the start of a working week rather than over a weekend, and away from
# install-check's Saturday run so two reds are never read as one problem.
#
# Deliberately not a required check, for the one-in-70 reason above.

on:
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - '.github/workflows/geweke-checks.yaml'
  schedule:
    - cron: '0 5 * * Tue'
  workflow_dispatch:

name: geweke-checks

jobs:
  geweke-checks:
    name: samplers sample from the right distribution
    runs-on: ubuntu-latest
    # generous next to a 40 second test, because the bulk of the job is
    # installing dependencies on a cache miss
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # quoted: the gate compares against the string "true", and an unquoted
      # YAML boolean is a needless thing to have to reason about
      GRETA_GEWEKE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::. any::devtools

      # the same command release_bullets() puts on the release checklist, so
      # what CI runs and what a maintainer runs by hand cannot drift apart
      - name: Run the Geweke checks
        run: Rscript -e 'devtools::test(filter = "posteriors_geweke")'
