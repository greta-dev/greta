# Do greta's samplers still sample from the distribution they should?
#
# test_posteriors_geweke.R compares hmc(), rwmh() and slice() against draws
# taken the long way round, by Gibbs sampling the posterior and the data
# generating function. It is the only check that catches a sampler drifting
# from its target: TensorFlow Probability 0.25.0 silently changed how
# lkj_correlation() and wishart() draw, and nothing else in the suite noticed.
#
# Runs here and not in the ordinary suite because it is stochastic, with each
# sampler checked at p >= 0.005, so a small chance of failure. The loop no
# longer rebuilds log prob tf_function per iteration, see #842
#
# Runs on PRs touching the code it tests, plus weekly as a backup, on Tuesday,
# so a failure is at the start of a working week rather a weekend, and away from
# install-check's Saturday run so there is some separation.

on:
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - '.github/workflows/geweke-checks.yaml'
  schedule:
    - cron: '0 5 * * Tue'
  workflow_dispatch:

name: geweke-checks

jobs:
  geweke-checks:
    name: samplers sample from the right distribution
    runs-on: ubuntu-latest
    # The bulk of the job is installing dependencies on a cache miss
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # quoted: the gate compares against the string "true"
      GRETA_GEWEKE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::. any::devtools

      # release_bullets() puts on checklist, linking CI and maintainer runs
      - name: Run the Geweke checks
        run: Rscript -e 'devtools::test(filter = "posteriors_geweke")'
